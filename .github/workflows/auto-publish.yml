name: Auto-publish approved drafts

# Daily check: any approved draft post whose publishedAt date has
# arrived gets flipped from `draft: true` to `draft: false`. The flip
# is committed to main, then this workflow explicitly dispatches the
# Deploy workflow to rebuild the site.
#
# Why the explicit dispatch: pushes made with the default GITHUB_TOKEN
# do NOT trigger other workflows (GitHub's anti-recursion rule), so the
# Deploy workflow's `push: main` trigger never fires for the commit we
# make here. workflow_dispatch is exempt from that rule, so we kick the
# deploy ourselves after pushing. Without this step the draft flips on
# main but the live site never rebuilds — published posts stay invisible.
#
# Eligibility rules (enforced by .github/scripts/auto-publish.mjs):
#   - draft: true
#   - approvedAt: present (Will hit "Approve" in the ReviewPanel)
#   - publishedAt <= today (UTC)
#
# Manual trigger also available via the Actions tab.

on:
  schedule:
    # 12:00 UTC daily = 08:00 ET (during EDT). Posts go live in the
    # morning ET on their publishedAt date.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Flip eligible drafts
        id: flip
        run: node .github/scripts/auto-publish.mjs

      - name: Commit + push if anything flipped
        if: steps.flip.outputs.flipped != '0' && steps.flip.outputs.flipped != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git commit -m "Auto-publish: flip approved drafts whose publishedAt has arrived

          Triggered by .github/workflows/auto-publish.yml on the daily cron.
          See .github/scripts/auto-publish.mjs for eligibility rules."
          git push

      - name: Trigger deploy
        # A GITHUB_TOKEN push does not fire Deploy's `push: main` trigger,
        # so dispatch it explicitly against main (now carrying the flip).
        if: steps.flip.outputs.flipped != '0' && steps.flip.outputs.flipped != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
