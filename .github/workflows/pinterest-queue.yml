name: Pinterest queue (keep pins ready to approve)

# Weekly buffer-keeper, same shape as draft-batch.yml. The rule: keep at least
# QUEUE_FLOOR (12) pins in the APPROVED BANK, which is three weeks at the
# 4/week rate in content/pinterest/pacing.md. When the bank is below that,
# render and write pins for published posts that have none, so Will always has
# something to approve. Every pin lands at status "draft" and GOES NOWHERE
# until he approves.
#
# Never posts. Posting is a Todoist tap (pinterest-todoist-queue.yml);
# pinterest-publish.yml is parked.
# Sunday 11:00 UTC ~= 7am EDT. Clear of draft-batch (Sat 09:00) and the
# auto-publish crons (12:00/16:00/21:00).
#
# OFF FROM 2026-08-16 TO 2026-10-01, reason never recorded. That is most of why
# the queue went stale, and two things had rotted by the time Will asked for it
# back:
#
#   1. The queue count was grep for `"status": "approved"`. The 2026-09-29
#      inversion made that always zero, because an approved pin now keeps
#      `status: "queued"` and carries `approvedAt`. The floor was therefore
#      breached on every run and the agent's own pile-on check was the only
#      brake left. Counted in node now, on the approved bank.
#   2. The floor was 14 "at 1/day". The rate is 4/week (pacing.md, 2026-10-01)
#      and the floor is 12, which is three weeks of approved stock.
#
# `dry_run` defaults TRUE for the same reason it does in pinterest-research.yml:
# this job is unproven until it has worked once since the inversion. Dispatch it
# dry, read the artifact, dispatch it live, THEN trust the cron.

on:
  schedule:
    - cron: "0 11 * * 0" # Sunday 11:00 UTC
  workflow_dispatch:
    inputs:
      queue_floor:
        description: "Render more pins when the approved bank is below this"
        type: string
        default: "12"
      max_posts:
        description: "Most posts to work in one run"
        type: string
        default: "3"
      drafts_ceiling:
        description: "Write nothing if this many pins are already awaiting approval"
        type: string
        default: "12"
      dry_run:
        description: "Render and write, but do not commit. Output goes up as an artifact either way."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pinterest-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps + Claude Code
        run: |
          npm ci || npm install
          npm install -g @anthropic-ai/claude-code

      # Counted in node, not grep. The 2026-09-29 pipeline inversion made the
      # old grep wrong and nothing caught it, because this workflow has not run
      # since 2026-08-16: it counted `"status": "approved"`, and after the
      # inversion an approved pin KEEPS `status: "queued"` and carries
      # `approvedAt` instead. So the count read 0 forever, the floor was always
      # breached, and the agent's own pile-on check was the only real brake.
      #
      # The number that matters is the APPROVED BANK: pins Will has approved
      # that have not gone out yet. `pacing.md` (2026-10-01) puts the floor at
      # 12, because Todoist tasks exist only for approved pins, so a bank of
      # zero means a silent account even with drafts piled up behind it.
      - name: Count the queue
        id: plan
        run: |
          FLOOR="${{ inputs.queue_floor || '12' }}"
          node --input-type=module -e '
            import fs from "node:fs";
            const dir = "content/pins";
            let bank = 0, drafts = 0, posted = 0;
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".json"))) {
                const j = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8"));
                for (const p of j.pins || []) {
                  const s = p.status || "draft";
                  if (s === "posted") posted++;
                  else if (s === "draft") drafts++;
                  if (p.approvedAt && s !== "posted" && s !== "rejected") bank++;
                }
              }
            }
            // Published blog posts with no pins file.
            const gaps = [];
            for (const f of fs.readdirSync("src/content/blog").filter((f) => f.endsWith(".mdx"))) {
              if (!/^draft:\s*false/m.test(fs.readFileSync("src/content/blog/" + f, "utf8"))) continue;
              const slug = f.replace(/\.mdx$/, "");
              if (!fs.existsSync(`${dir}/${slug}.json`)) gaps.push(slug);
            }
            // Evergreen SITE pages with no pins file, added 2026-10-01.
            //
            // These were invisible to this job until today, and on 2026-10-01
            // that cost 24 pins. Will wiped every unposted pin to start the new
            // flow; two thirds of them pointed at site pages, and because this
            // count only ever looked at src/content/blog, nothing could
            // regenerate them. The playbook has said since 2026-08-08 that
            // inventory is not only blog posts and that /what-to-bring is one
            // of the strongest travel formats on Pinterest, which made the gap
            // a documented idea that no code implemented.
            //
            // Listed explicitly rather than globbed: src/pages also holds 404,
            // privacy, book and the journal index, none of which is a pin
            // destination.
            const SITE_PAGES = [
              "activities", "amenities", "area", "faq",
              "getaway-guide", "photos", "the-cottage", "what-to-bring",
            ];
            for (const slug of SITE_PAGES) {
              if (!fs.existsSync(`${dir}/${slug}.json`)) gaps.push(slug);
            }
            const uncovered = gaps.length;
            const floor = Number(process.env.FLOOR || 12);
            const need = bank < floor ? 1 : 0;
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `bank=${bank}\ndrafts=${drafts}\nposted=${posted}\nuncovered=${uncovered}\ngaps=${gaps.join(",")}\nneed=${need}\n`);
            console.log(`approved bank=${bank} (floor ${floor}) | awaiting-approval=${drafts} | posted=${posted} | pages-with-no-pins=${uncovered} | run=${need}`);
            if (uncovered) console.log(`  no pins yet: ${gaps.join(", ")}`);
          '
        env:
          FLOOR: ${{ inputs.queue_floor || '12' }}

      - name: Render + write pins (gated at draft)
        if: steps.plan.outputs.need == '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_POSTS: ${{ inputs.max_posts || '3' }}
          DRAFTS_WAITING: ${{ steps.plan.outputs.drafts }}
          DRAFTS_CEILING: ${{ inputs.drafts_ceiling || '12' }}
          GAPS: ${{ steps.plan.outputs.gaps }}
        run: |
          claude -p "You are the Captain's Cottage Pin Writer running headless on the weekly cron.

          Read and FOLLOW .claude/agents/pin-writer.md as your role instructions. Read content/pinterest/playbook.md first and follow its specs over your own defaults. Read content/pinterest/keywords.json, CLAUDE.md (locked location wording), and content/voice-feedback-log.md.

          There are $DRAFTS_WAITING pins already waiting on Will's approval. Do not pile on: if that number is $DRAFTS_CEILING or higher, write nothing, print 'SKIPPED: queue already full' and stop.

          Read content/pinterest/decisions.md before you choose dates. It holds our own operating decisions and it outranks the playbook. Read content/pinterest/pacing.md for the current rate and runway.

          Otherwise pick up to $MAX_POSTS destinations that have the fewest pins, preferring any with none at all. These have none at all right now: $GAPS. A destination is EITHER a published journal post (src/content/blog/<slug>.mdx with frontmatter draft:false) OR one of the evergreen site pages, which are always live and need no draft check: activities, amenities, area, faq, getaway-guide, photos, the-cottage, what-to-bring. Site pages are inventory too, and the playbook rates /what-to-bring among the strongest travel formats on Pinterest; build pins from the page's own content and images rather than from a post. For each: run 'npm run build:pins -- <slug>', check the renders are sensible, then write the pin copy into content/pins/<slug>.json per the agent file. Each pin tests a DIFFERENT keyword variant from keywords.json and gets its own utm_content. Space one post's variants at least 5 days apart, never more than 3 pins on any one date across the whole queue, and never a date less than 2 days out.

          HARD RULES: every pin status is 'draft'. Never write 'approved'. Never post or call any API. Never pin a post whose frontmatter says draft:true. No 'Hull Creek' in any title or keyword. No em dashes and no 'honest' anywhere. Do NOT run git; the workflow commits.

          Finish by printing 'QUEUED: <slug> <n> pins' per post." --permission-mode bypassPermissions --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      # Always, dry run or not. This job had not run since 2026-08-16, so its
      # first output after the inversion is worth reading before anything
      # downstream consumes it. JSON only; the rendered images are large and
      # the listing is enough to see what was produced.
      - name: Upload what the pin writer wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-writer-output
          path: content/pins/
          if-no-files-found: warn

      - name: Show what changed
        if: always()
        run: |
          git --no-pager diff --stat content/pins public/pins || true
          echo "--- new or changed renders:"
          git status --porcelain public/pins || true

      - name: Commit + notify
        if: steps.plan.outputs.need == '1' && !inputs.dry_run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DRAFTS_WEBHOOK_URL }}
        run: |
          if [[ -z "$(git status --porcelain content/pins public/pins .flowstatus.json)" ]]; then
            echo "No new pins produced; nothing to commit."
            exit 0
          fi
          NEW=$(grep -ho '"id": *"[^"]*"' content/pins/*.json | sed 's/.*"id": *"//;s/"//' | tail -12 | paste -sd ', ' -)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pins public/pins .flowstatus.json
          git commit -m "pinterest-queue: render + queue pins (awaiting approval)"
          git pull --rebase origin main
          git push
          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            curl -s -o /dev/null -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
              --data "{\"username\":\"Captain's Cottage\",\"embeds\":[{\"title\":\"New pins ready to approve\",\"description\":\"${NEW}\\n\\nAll at status draft and gated. Nothing posts until you flip them to approved in content/pins/*.json.\",\"color\":12079150}]}"
          fi
