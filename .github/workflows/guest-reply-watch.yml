name: Guest-reply watcher

# Every ~10 min: read NEW Airbnb guest messages from Gmail (read-only), draft a
# reply with Claude (subscription OAuth token — no API billing), and post it to
# Will's Discord with a prefilled compose link. Will taps → Gmail compose →
# Send → relays to the guest. Nothing is ever sent automatically.
#
# Public repo → Actions minutes are free/unlimited, so 10-min polling is fine.
# GitHub's scheduler is best-effort (runs can be a few min late) — acceptable.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run a top-to-bottom test: draft a simulated question → Discord (skips Gmail)"
        type: boolean
        default: false
      test_question:
        description: "Optional: the simulated guest question to draft (blank = sample)"
        type: string
        default: ""
      mark_seen:
        description: "Mark the current Airbnb backlog as seen (no drafts/pings); only new messages notify after"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: guest-reply-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run watcher
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_QUESTION: ${{ inputs.test_question }}
          MARK_SEEN: ${{ inputs.mark_seen }}
        run: node .github/scripts/guest-reply-cloud.mjs

      - name: Persist state + feedback log (only when changed)
        run: |
          if [[ -n "$(git status --porcelain content/replies/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/replies/
            git commit -m "watch: update guest-reply state / feedback log"
            git pull --rebase origin main
            git push
          else
            echo "Nothing new; content/replies unchanged."
          fi
