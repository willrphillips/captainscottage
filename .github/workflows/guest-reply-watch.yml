name: Guest-reply watcher

# Every ~10 min: read NEW Airbnb guest messages from Gmail (read-only), draft a
# reply with Claude (subscription OAuth token — no API billing), and push it to
# Will's Telegram with a prefilled mailto. Will taps → Gmail compose → Send →
# relays to the guest. Nothing is ever sent automatically.
#
# Public repo → Actions minutes are free/unlimited, so 10-min polling is fine.
# GitHub's scheduler is best-effort (runs can be a few min late) — acceptable.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a sample test draft to Telegram (skips Gmail)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: guest-reply-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run watcher
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: node .github/scripts/guest-reply-cloud.mjs

      - name: Persist dedup state (only when it changed)
        run: |
          if [[ -n "$(git status --porcelain content/replies/.watch-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/replies/.watch-state.json
            git commit -m "watch: update guest-reply dedup state"
            git push
          else
            echo "No new guest messages; state unchanged."
          fi
