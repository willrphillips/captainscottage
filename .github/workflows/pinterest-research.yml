name: Pinterest research + pacing (monthly)

# Monthly. Pinterest changes its specs, limits, and ranking behavior often enough
# that a playbook older than a quarter is a liability, and the pin-writer follows
# the playbook over its own instructions. This run re-verifies against live
# sources and rewrites content/pinterest/playbook.md + keywords.json.
#
# Writes nothing that reaches Pinterest. Research only.
# Cron is UTC and does not shift for DST. 08:00 UTC ~= 4am EDT, ahead of the
# Saturday 09:00 draft-batch run so the two never overlap.
#
# FIRST RUN: 2026-10-01. This workflow was written in August and then sat
# `disabled_manually` with ZERO runs for seven weeks, so none of it had ever
# been exercised. Will asked for the researcher on 2026-10-01 ("activate the
# ones for pinterest that checks against other high-traffic accounts in a
# similar market as us that we can follow"). Two things were fixed before the
# first dispatch rather than discovered by it:
#
#   1. The prompt says "rewrite playbook.md", and by then that file carried a
#      week of hand-made operating decisions. They moved to
#      content/pinterest/decisions.md, which no agent may write.
#   2. `dry_run` was added, because a never-run job that commits and pushes on
#      its own gives you nothing to inspect first. A dry run skips the commit;
#      either way the output goes up as an artifact.
#
# Do not put the cron back under a schedule the first time it works. Dispatch it
# dry, read the artifact, dispatch it live, read the commit, THEN trust the cron.

on:
  schedule:
    - cron: "0 8 1 * *" # 1st of the month, 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research and write, but do not commit. Output goes up as an artifact either way."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pinterest-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh the playbook
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "You are the Captain's Cottage Pinterest Researcher running headless on the monthly cron.

          Read and FOLLOW .claude/agents/pinterest-researcher.md as your role instructions. Also read PINTEREST_PLAN.md, CLAUDE.md (the locked location wording is binding), content/pinterest/decisions.md, and your own previous content/pinterest/playbook.md.

          Do a full research pass and rewrite content/pinterest/playbook.md and content/pinterest/keywords.json per that agent file. Verify every spec and number against live sources with WebSearch/WebFetch. Never state a number without a source URL and retrieval date. Where sources disagree, give the count and say so.

          TWO SECTIONS ARE REQUIRED THIS RUN, because Will asked for them by name. 'Accounts to follow': named high-traffic accounts in this market, as handles, with what each does that we do not. 'Posting times': what hour by weekday pins in this niche actually get saved and clicked, US Eastern, three or four slots with sources. If the timing evidence is thin or contradictory, SAY SO IN THOSE WORDS and recommend nothing. A fabricated best-time gets built into a script; an admitted gap stays a human decision. The agent file spells both sections out.

          HARD RULES: never post, schedule, or approve anything. Never touch content/pins/, src/content/blog/, content-calendar.json, or content/pinterest/decisions.md (that file is our own dated decisions, not research; read it, never write it). Any dated correction already inside playbook.md is institutional memory: carry it forward, reworded if the facts moved, never silently dropped. Do NOT run git; the workflow commits. No em dashes and never use 'honest'/'honestly'/'candidly' to vouch for a statement, in any file you write.

          Finish by printing 'CHANGED:' followed by the three most consequential things that changed since the last playbook, one per line. If nothing material changed, print 'CHANGED: nothing material'." --permission-mode bypassPermissions --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Re-check pacing and runway
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "You are the Captain's Cottage Pinterest Strategist running headless on the monthly cron.

          Read and FOLLOW .claude/agents/pinterest-strategist.md as your role instructions. Read the playbook the researcher just rewrote, content/pinterest/decisions.md, the live queue in content/pins/*.json, content-calendar.json, and PINTEREST_PLAN.md.

          Do the runway arithmetic explicitly and rewrite content/pinterest/pacing.md per that agent file. Benchmark against genuinely comparable accounts (single properties and small regional travel operations) using WebSearch/WebFetch, and record handles and dates for anything you claim. Note plainly what is not observable rather than inferring it.

          Standing fact as of 2026-08-14: Will said the blog will slow way down after the currently scheduled posts, so replenishment from new posts trends to zero. Do not assume the biweekly cadence continues.

          CONTEXT YOU NEED FOR THE RATE, 2026-10-01: the per-session cap is being retired. Will approves a bank of pins in CAPCOM and each one becomes a Todoist task due at its own posting time, so the thing that limits the rate is no longer how many he can tap in one sitting. The platform ceilings still bind: 5 days between pins to the same URL, at most 3 live in a day, 10 scheduled inside 30 days. Give the rate against those.

          HARD RULES: never write to content/pins/ or content/pinterest/decisions.md, never schedule, approve, or post anything. Your write scope is content/pinterest/pacing.md only. Do NOT run git; the workflow commits. No em dashes and never use 'honest'/'honestly'/'candidly' to vouch for a statement.

          Finish by printing 'PACING:' followed by the recommended pins per week and the date the queue runs dry at that rate." --permission-mode bypassPermissions --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # Always, dry run or not. A never-run job's first output is the whole
      # point of the exercise, and a dry run that commits nothing would
      # otherwise leave nothing behind to read.
      - name: Upload what the agents wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-research-output
          path: content/pinterest/
          if-no-files-found: warn

      - name: Show the diff
        if: always()
        run: git --no-pager diff --stat content/pinterest || true

      - name: Guard decisions.md
        if: always()
        run: |
          if ! git diff --quiet content/pinterest/decisions.md; then
            echo "::error::An agent wrote to content/pinterest/decisions.md, which is off limits. Not committing."
            git --no-pager diff content/pinterest/decisions.md
            exit 1
          fi
          echo "decisions.md untouched, as required."

      - name: Commit + notify
        if: ${{ !inputs.dry_run }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DRAFTS_WEBHOOK_URL }}
        run: |
          if [[ -z "$(git status --porcelain content/pinterest .flowstatus.json)" ]]; then
            echo "Playbook unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pinterest .flowstatus.json
          git commit -m "pinterest-research: refresh playbook, keywords, and pacing plan"
          git pull --rebase origin main
          git push
          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            curl -s -o /dev/null -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
              --data "{\"username\":\"Captain's Cottage\",\"embeds\":[{\"title\":\"Pinterest playbook refreshed\",\"description\":\"content/pinterest/playbook.md and keywords.json updated. The pin-writer follows the playbook over its own defaults, so read the 'What changed' section before the next queue run.\",\"color\":14776621}]}"
          fi
