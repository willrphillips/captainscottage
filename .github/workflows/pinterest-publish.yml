name: Pinterest publish (API, PARKED)

# PARKED 2026-08-21. Do not re-enable the schedule without checking the app's
# access tier first.
#
# This job posted via Pinterest API v5. It cannot work on our app's Trial
# access: every POST /v5/pins returns 403 code 29, "Apps with Trial access may
# not create Pins in production". It failed silently every night from
# 2026-08-17 to 2026-08-20 (the script exits 0 on a failed pin, so GitHub
# showed green while nothing posted).
#
# Replaced by pinterest-todoist-queue.yml, which needs no Pinterest app at all:
# it turns each approved pin into a Todoist task carrying a pre-filled save
# link, due at the moment the pin should go live.
#
# The cron is removed, not the workflow. If Standard access is ever granted,
# restore `schedule: - cron: "0 14 * * *"` and retire the Todoist queue.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Most pins to post in one run"
        type: string
        default: "3"
      dry_run:
        description: "Log only, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pinterest-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post what is due
        id: post
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_MAP: ${{ secrets.PINTEREST_BOARD_MAP }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          node scripts/pinterest-publish.mjs --limit "${{ inputs.limit || '3' }}" | tee /tmp/pin-out.txt
          echo "summary=$(tail -1 /tmp/pin-out.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit status changes
        run: |
          if [[ -z "$(git status --porcelain content/pins)" ]]; then
            echo "No queue changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pins
          git commit -m "pinterest-publish: mark posted pins"
          git pull --rebase origin main
          git push

      - name: Notify on failures only
        if: contains(steps.post.outputs.summary, 'failed') && !contains(steps.post.outputs.summary, '0 failed')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DRAFTS_WEBHOOK_URL }}
        run: |
          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            curl -s -o /dev/null -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
              --data "{\"username\":\"Captain's Cottage\",\"embeds\":[{\"title\":\"Pinterest publish had failures\",\"description\":\"${{ steps.post.outputs.summary }}\\n\\nThe error is recorded on each pin in content/pins/*.json and will retry tomorrow.\",\"color\":15158332}]}"
          fi
