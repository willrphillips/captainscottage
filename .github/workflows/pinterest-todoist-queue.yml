name: Pinterest queue to Todoist

# Daily. Every pin that is BOTH status "approved" and not already queued gets a
# Todoist task carrying a pre-filled Pinterest save link, due at the moment the
# pin should go live, with a push reminder at that time.
#
# The gate is the same one the old API job used: agents write "draft", only Will
# writes "approved". This job cannot queue anything he has not seen.
#
# This replaces pinterest-publish.yml, which is parked. Pinterest's save
# endpoint needs no app, no token and no access tier, so the Trial-access wall
# does not apply here.
#
# No TODOIST_API_TOKEN secret means a dry run that logs the links it would have
# queued and exits clean.
#
# 13:30 UTC, ahead of the 14:00 slot the API job used, and clear of the
# auto-publish crons (12:00/16:00/21:00) and guest-reply-tune (13:00). Pins are
# queued the morning of their date, so this must run before PIN_PUBLISH_TIME.

on:
  schedule:
    - cron: "30 13 * * *" # daily 13:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Most pins to queue in one run"
        type: string
        default: "25"
      dry_run:
        description: "Log only, queue nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pinterest-todoist-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Queue approved pins
        id: queue
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          TODOIST_PROJECT_ID: ${{ vars.TODOIST_PROJECT_ID }}
          PIN_PUBLISH_TIME: ${{ vars.PIN_PUBLISH_TIME }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          node scripts/pinterest-todoist-queue.mjs --limit "${{ inputs.limit || '25' }}" | tee /tmp/pin-queue.txt
          echo "summary=$(tail -1 /tmp/pin-queue.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit status changes
        if: always()
        run: |
          if [[ -z "$(git status --porcelain content/pins)" ]]; then
            echo "No queue changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pins
          git commit -m "pinterest-queue: mark pins queued to Todoist"
          git pull --rebase origin main
          git push

      - name: Notify on failures only
        if: failure() || (contains(steps.queue.outputs.summary, 'failed') && !contains(steps.queue.outputs.summary, '0 failed'))
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DRAFTS_WEBHOOK_URL }}
        run: |
          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            curl -s -o /dev/null -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
              --data "{\"username\":\"Captain's Cottage\",\"embeds\":[{\"title\":\"Pinterest queue to Todoist had failures\",\"description\":\"${{ steps.queue.outputs.summary }}\\n\\nThe error is recorded on each pin in content/pins/*.json and will retry tomorrow.\",\"color\":15158332}]}"
          fi
